
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CloudTaskDb;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY}
      Database__MigrateOnStartup: "true"
    ports:
      - "8081:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: src/CloudTask.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Api__BaseUrl: "http://api:8080/"
    ports:
      - "8082:8080"
    depends_on:
      - api

volumes:
  sqldata:
